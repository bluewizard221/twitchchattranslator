<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ログイン | Twitch チャット翻訳bot 管理画面</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="data:,">
</head>
<body class="login-page">

<div class="login-card">
    <div class="logo-mark" aria-hidden="true">訳</div>
    <h1>Twitch チャット翻訳bot</h1>
    <p class="lead">管理画面にログインします</p>

    <div id="message"></div>

    <a class="btn btn-twitch" id="loginButton" href="/auth/twitch">Twitch でログイン</a>

    <p class="login-note">
        ログインできるのは、運営者と、運営者が登録したチャンネルの配信者です。<br>
        ログイン時に <code>channel:bot</code> の許可を求めます。登録済みの配信者が許可すると、
        bot アカウントがそのチャンネルで翻訳を受信・投稿できるようになります（許可は Twitch の「設定 → 接続」からいつでも外せます）。<br>
        パスワードと二段階認証は Twitch 側で確認します。Twitch アカウントの二段階認証を有効にしておいてください。
    </p>
</div>

<script src="/js/login.js"></script>
</body>
</html>
